<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供应商成长管理台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23162c50'/%3E%3Cpath d='M8 23V16h4v7m3 0V11h4v12m3 0V6h4v17' stroke='%234ad6b4' stroke-width='3'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182b48;font:16px/1.6 system-ui,-apple-system,sans-serif}header{background:#142b4e;color:white;padding:26px 5%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}small{font-size:13px;color:#7a8ca5}header small{color:#a8bbd8}main{max-width:1380px;margin:30px auto;padding:0 24px}nav{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}button,.button{font:inherit;cursor:pointer;border:1px solid #d5deeb;background:white;color:#213855;padding:9px 17px;border-radius:8px}button.active,.primary{background:#17675d;color:white;border-color:#17675d}button:hover{filter:brightness(.95)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card,.panel{background:white;border:1px solid #dce4ef;border-radius:12px;padding:22px}.card strong{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar h2{margin-right:auto}h2{font-size:21px;margin:0 0 14px}input,select,textarea{font:inherit;padding:9px;border:1px solid #ccd8e7;border-radius:7px;background:white;max-width:100%}label{display:block;margin:12px 0}label input,label select,label textarea{display:block;width:100%}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #e6ecf4;padding:15px 12px}th{font-size:14px;color:#68809a}td small{display:block}.tag{padding:4px 9px;border-radius:5px;background:#e4f4ee;color:#17675d;font-size:14px}.risk{background:#fff0e9;color:#ae4b2a}.muted{color:#6f8097}.empty{padding:50px;text-align:center;color:#6f8097}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.bar{height:6px;background:#e7edf4;width:90px;border-radius:5px;margin-top:5px}.bar i{display:block;background:#248b7d;height:100%;border-radius:5px}dialog{border:0;border-radius:14px;padding:28px;max-width:800px;width:95%;max-height:90vh;overflow:auto}dialog::backdrop{background:#142b4e80}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.notice{padding:14px 18px;background:#edf4ff;border-radius:8px;margin:16px 0}.error{color:#a43d2d}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#142b4e;color:white;padding:12px 22px;border-radius:9px;display:none;z-index:10}p{margin:10px 0}.metric{font-weight:600;color:#17675d}@media(max-width:750px){.cards,.grid{grid-template-columns:1fr 1fr}header{padding:20px}main{padding:0 14px}.panel{padding:15px}.grid.form{grid-template-columns:1fr}.cards .card{padding:15px}}
</style><header><div><small>SUPPLIER DEVELOPMENT</small><h1>供应商成长管理台</h1></div><small id="sync">连接中</small></header><main><nav id="nav"></nav><section id="view"></section></main><dialog id="modal"></dialog><div id="toast" role="status"></div><script src="./config.js"></script><script>
let accessToken=null;let state,revision,tab='总览与评分',month=new Date().toLocaleDateString('sv-SE').slice(0,7),busy=false;const labels=['资质合规','价格优势','质量表现','交付能力','资源支持','交付准确率','配合意愿'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0});
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}
const settings=window.SUPPLIER_CONFIG||{};
let refreshTimer=null,sessionEpoch=0;
function authHeaders(){const h={apikey:settings.anonKey,'Content-Type':'application/json'};if(accessToken)h.Authorization='Bearer '+accessToken;return h}
async function cloudRequest(path,options={}){const r=await fetch(settings.url.replace(/\/$/,'')+path,{...options,headers:{...authHeaders(),...options.headers}});const raw=await r.text();let body;try{body=raw?JSON.parse(raw):null}catch{body=null}if(!r.ok)throw Error(body?.msg||body?.message||'在线服务请求失败');return body}
async function verifyAdmin(){await cloudRequest('/auth/v1/user');const rows=await cloudRequest('/rest/v1/supplier_administrators?select=user_id');if(rows.length!==1)throw Error('此账号尚未获管理员权限，请联系站点管理员')}
function scheduleRefresh(r){clearTimeout(refreshTimer);if(r.refresh_token)refreshTimer=setTimeout(()=>refreshLogin(r.refresh_token),Math.max(60,(r.expires_in||3600)-60)*1000)}
async function login(f){const epoch=++sessionEpoch;clearTimeout(refreshTimer);const values=new FormData(f),button=f.querySelector('button');if(button)button.disabled=true;try{const r=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:values.get('email').trim(),password:values.get('password')})});if(epoch!==sessionEpoch)return;accessToken=r.access_token;await verifyAdmin();if(epoch!==sessionEpoch)return;$('#modal').close();await load();scheduleRefresh(r)}catch(e){if(epoch!==sessionEpoch)return;accessToken=null;toast(e.message)}finally{if(button)button.disabled=false}}
async function refreshLogin(refreshToken){const epoch=sessionEpoch;try{const r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:refreshToken})});if(epoch!==sessionEpoch)return;accessToken=r.access_token;await verifyAdmin();if(epoch!==sessionEpoch)return;scheduleRefresh(r)}catch(e){if(epoch!==sessionEpoch)return;clearSession();toast('登录已过期，请重新登录');loginScreen()}}
function loginScreen(){if(!settings.url||!settings.anonKey){$('#sync').textContent='尚未连接数据库';$('#view').innerHTML='<div class="panel"><h2>管理员账号待初始化</h2><p>完成数据库连接和管理员邀请后，你会收到设置密码的邮件。页面不会预置默认账号或密码。</p></div>';return}$('#sync').textContent='管理员登录';show('<h2>管理员登录</h2><p>手机和电脑使用同一账号，数据自动同步。</p><form onsubmit="event.preventDefault();login(this)"><label>邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button><button type="button" onclick="recoveryScreen()">首次设置 / 忘记密码</button></form>')}
function recoveryScreen(){show('<h2>设置或重置管理员密码</h2><p>输入已获管理员授权的邮箱，通过邮件中的链接设置密码。</p><form onsubmit="event.preventDefault();sendRecovery(this)"><label>管理员邮箱<input name="email" type="email" autocomplete="username" required></label><button class="primary">发送设置邮件</button><button type="button" onclick="loginScreen()">返回登录</button></form>')}
async function sendRecovery(f){const button=f.querySelector('button');button.disabled=true;try{const email=new FormData(f).get('email').trim();await cloudRequest('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',body:JSON.stringify({email})});toast('若邮箱已登记，你会收到设置邮件，请检查收件箱');loginScreen()}catch(e){toast('邮件发送失败，请稍后重试')}finally{button.disabled=false}}
function passwordScreen(){show('<h2>设置管理员密码</h2><form onsubmit="event.preventDefault();setAdminPassword(this)"><label>新密码（至少12位）<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>再次输入密码<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary">保存密码</button></form>')}
async function setAdminPassword(f){const values=new FormData(f),password=values.get('password'),confirm=values.get('confirm');if(password.length<12||password!==confirm)return toast('请填写至少12位、两次相同的密码');const button=f.querySelector('button');button.disabled=true;try{await verifyAdmin();await cloudRequest('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})});await logout();toast('密码已设置，请使用新密码登录')}catch(e){toast(e.message)}finally{button.disabled=false}}
function clearSession(){sessionEpoch++;clearTimeout(refreshTimer);accessToken=null;state=undefined;revision=undefined;$('#nav').innerHTML='';$('#view').innerHTML='';if($('#modal').open)$('#modal').close()}
async function logout(){let pending;try{if(accessToken)pending=cloudRequest('/auth/v1/logout',{method:'POST'})}catch{}clearSession();loginScreen();try{await pending}catch{}}
async function bootAuth(){const hash=new URLSearchParams(location.hash.slice(1)),token=hash.get('access_token'),type=hash.get('type');if(location.hash)history.replaceState({},'',location.pathname+location.search);if(!settings.url||!settings.anonKey)return loginScreen();if(token&&['invite','recovery'].includes(type)){accessToken=token;try{await verifyAdmin();scheduleRefresh({refresh_token:hash.get('refresh_token'),expires_in:Number(hash.get('expires_in'))||3600});passwordScreen()}catch(e){accessToken=null;toast('设置链接无效或账号未授权，请重新申请设置邮件');loginScreen()}}else loginScreen()}
async function fetchState(){const rows=await cloudRequest('/rest/v1/supplier_management_state?select=revision,data');return rows.length?rows[0]:{revision:0,data:{suppliers:[],monthly:[],plans:[],weights:[35,30,35]}}}
async function load(){const epoch=sessionEpoch;try{const d=await fetchState();if(epoch!==sessionEpoch)return;state=d.data;revision=d.revision;render();$('#sync').textContent='在线同步 · 已登录'}catch(e){$('#sync').textContent='同步失败';toast(e.message)}}
async function save(next){if(busy)return false;const epoch=sessionEpoch;busy=true;try{const newRevision=await cloudRequest('/rest/v1/rpc/save_supplier_management',{method:'POST',body:JSON.stringify({expected_revision:revision,next_data:next})});if(epoch!==sessionEpoch)return false;revision=newRevision;state=next;render();toast('已保存，评分已更新');return true}catch(e){toast(e.message);return false}finally{busy=false}}
function monthly(){return state.monthly.filter(m=>m.month===month)}
function result(s){let data=monthly(),m=data.find(x=>x.id===s.id),sales=data.reduce((a,x)=>a+x.sales,0),profit=data.reduce((a,x)=>a+Math.max(0,x.profit),0);let a=s.scores.slice(0,4).reduce((a,x)=>a+x,0)/4,b=s.scores.slice(4).reduce((a,x)=>a+x,0)/3,ss=m&&sales>0?m.sales/sales:0,ps=m&&profit>0?Math.max(0,m.profit)/profit:0,c=m&&sales>0&&profit>0?Math.min(100,ss/.2*100)*.4+Math.min(100,ps/.2*100)*.6:null,total=c===null?null:(a*state.weights[0]+b*state.weights[1]+c*state.weights[2])/100,risk=s.scores[0]<60||s.scores[2]<60||s.scores[3]<60||s.scores[5]<60;let level=total===null?'待补数据':risk?'D 改善观察':total>=85?'A 战略合作':total>=70?'B 重点培养':total>=60?'C 常规管理':'D 改善观察';return {a,b,c,total,ss,ps,m,risk,level}}
function render(){ $('#nav').innerHTML=['总览与评分','月度经营导入','培养与改善','评分规则'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let data=monthly(),sales=data.reduce((a,x)=>a+x.sales,0),profit=data.reduce((a,x)=>a+x.profit,0);let head=`<div class="toolbar"><h2>${tab}</h2><button onclick="logout()">退出登录</button><input aria-label="评估月份" type="month" value="${month}" onchange="month=this.value;render()"><button onclick="download('供应商备份.json',JSON.stringify(state,null,2),'application/json')">导出备份</button></div>`;
if(tab==='总览与评分'){$('#view').innerHTML=head+`<div class="cards"><div class="card">供应商<strong>${state.suppliers.length}</strong></div><div class="card">月度销售额<strong>${money(sales)}</strong></div><div class="card">月度毛利额<strong>${money(profit)}</strong></div><div class="card">需重点改善<strong>${state.suppliers.filter(s=>result(s).risk).length}</strong></div></div><div class="panel"><div class="toolbar"><h2>供应商分层</h2><button class="primary" onclick="editSupplier()">新增供应商</button><button onclick="sample()">载入演示数据</button></div><p class="muted">评估月份：${month} · 经营贡献使用当前已导入供应商的月度合计作为分母。</p>${state.suppliers.length?`<div class="tablewrap"><table><thead><tr><th>供应商</th><th>资质与能力</th><th>配合度</th><th>经营贡献</th><th>综合分 / 等级</th><th>月度销售 / 毛利</th><th>操作</th></tr></thead><tbody>${state.suppliers.map(s=>{let r=result(s);return `<tr><td><b>${esc(s.name)}</b><small>${esc(s.id)} · ${esc(s.owner||'未指定负责人')}</small></td>${[r.a,r.b,r.c].map(v=>`<td>${v===null?'待补数据':v.toFixed(1)}<div class="bar"><i style="width:${v||0}%"></i></div></td>`).join('')}<td><b>${r.total===null?'—':r.total.toFixed(1)}</b> <span class="tag ${r.risk?'risk':''}">${r.level}</span>${r.risk?'<small class="error">资质、质量或交付低于60分</small>':''}</td><td>${r.m?money(r.m.sales):'—'}<small>${r.m?money(r.m.profit):'—'} · 销售占比 ${(r.ss*100).toFixed(1)}%</small></td><td><button onclick="editSupplier('${esc(s.id)}')">评估</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">先新增供应商，再导入月度销售与毛利数据。<br>也可以载入标记清晰的演示数据体验模型。</div>'}</div>`}
if(tab==='月度经营导入'){$('#view').innerHTML=head+`<div class="panel"><h2>月度数据入口</h2><p>CSV 必须包含：供应商编号、月份、销售额、毛利额。金额以人民币元填写，销售额为非负数，毛利额允许为负且不得超过销售额。</p><div class="toolbar"><button onclick="download('月度导入模板.csv','供应商编号,月份,销售额,毛利额\\n'.replace('\\n','\n')+'SUP001,'+month+',100000,25000\n')">下载 CSV 模板</button><input type="file" accept=".csv,text/csv" aria-label="选择月度CSV文件" onchange="importCSV(this.files[0])"></div><div class="notice">同一编号、同一月份会覆盖原金额；不累计。未知供应商编号、重复行或格式错误会阻止整批导入。请先建立供应商档案。导入前显示预览。</div><div class="tablewrap"><table><thead><tr><th>供应商</th><th>月份</th><th>销售额</th><th>毛利额</th><th>毛利率</th></tr></thead><tbody>${data.map(m=>`<tr><td>${esc(state.suppliers.find(s=>s.id===m.id)?.name||m.id)}</td><td>${m.month}</td><td>${money(m.sales)}</td><td>${money(m.profit)}</td><td>${m.sales?(m.profit/m.sales*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
if(tab==='培养与改善'){$('#view').innerHTML=head+`<div class="grid">${state.suppliers.map(s=>{let r=result(s),weak=labels.filter((_,i)=>s.scores[i]<70);return `<div class="panel"><div class="toolbar"><h2>${esc(s.name)}</h2><span class="tag ${r.risk?'risk':''}">${r.level}</span></div><p>${r.risk?'启动30天整改，明确质量/交付根因和纠正措施；同步准备备选供应源。':r.total===null?'先补齐月度经营数据，再确认分层；可先推进能力改善。':r.total>=85?'季度业务复盘，联合销售预测与资源计划；持续监控供货集中度。':r.total>=70?'制定90天培养计划，通过小批量验证后逐步增加合作份额。':r.total>=60?'标准化订单与月度绩效复盘，优先改善价格和交付效率。':'制定30天改善计划，未达标则减少合作并评估替代。'}</p><p class="muted">重点提升：${weak.length?weak.join('、'):'保持优势，识别新的增长机会'}</p><button onclick="editPlan('${esc(s.id)}')">新增培养目标</button>${state.plans.filter(p=>p.id===s.id).map((p,i)=>`<div class="notice"><b>${esc(p.goal)}</b><p>${esc(p.action)}</p><small>负责人 ${esc(p.owner)} · 截止 ${esc(p.due)} · 验收 ${esc(p.target)}</small><label>进度<select onchange="planStatus('${p.key}',this.value)">${['未开始','进行中','已完成','未达标'].map(v=>`<option ${v===p.status?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}</div>`}).join('')||'<div class="empty">新增供应商后生成培养建议。</div>'}</div>`}
if(tab==='评分规则'){$('#view').innerHTML=head+`<div class="grid"><div class="panel"><h2>可调整评分权重</h2><form onsubmit="event.preventDefault();setWeights(this)">${['资质与能力','配合度','经营贡献'].map((x,i)=>`<label>${x}（%）<input name="w${i}" type="number" min="0" max="100" required value="${state.weights[i]}"></label>`).join('')}<p class="muted">权重合计必须为100%。规则修改后所有供应商即时重算。</p><button class="primary">保存权重</button></form></div><div class="panel"><h2>计算口径</h2><p>资质与能力＝资质合规、价格优势、质量表现、交付能力的平均分。</p><p>配合度＝资源支持、交付准确率、配合意愿的平均分。</p><p>经营贡献＝销售占比分×40%＋正毛利贡献占比分×60%。单项得分＝min(占比÷20%×100，100)。20%为初始满分标杆。</p><p>销售占比＝供应商销售额÷当月已导入销售额合计。毛利占比＝max(供应商毛利，0)÷当月正毛利合计；亏损供应商该项得0分。</p><p>缺月度记录、总销售为0或正毛利合计为0时，综合分暂不生成。导入范围不全会影响占比和分层。</p></div><div class="panel"><h2>分层与管理节奏</h2><p>A ≥85：战略合作，季度复盘。<br>B 70–84.9：重点培养，90天计划。<br>C 60–69.9：常规管理，月度复盘。<br>D ＜60：改善观察，30天整改。</p><p>资质合规、质量表现、交付能力或交付准确率任何一项低于60分，强制进入D层；缺经营数据仍显示风险提醒。</p></div><div class="panel"><h2>打分依据与证据</h2><p>90–100：持续超出目标；75–89：稳定达标；60–74：偶有偏差；40–59：多次未达标；0–39：严重问题。每次评估记录证据和日期。</p><p>价格：同规格、含税、含运费比价。质量：合格率、客诉、整改闭环。交付能力：产能与周期；交付准确率：实际准时足量履约率。配合意愿：响应及时性和问题闭环。</p><p>资质存在禁止合作事项应另行停止合作；该评分不能替代准入审查。分层表示当前表现，战略价值还需考虑替代难度。</p></div></div>`}}
function show(html){$('#modal').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}function closeModal(){$('#modal').close()}
function editSupplier(id){let s=state.suppliers.find(x=>x.id===id)||{id:'',name:'',owner:'',scores:Array(7).fill(75),evidence:''};show(`<h2>${id?'评估供应商':'新增供应商'}</h2><form onsubmit="event.preventDefault();supplierSave(this,'${esc(id||'')}')"><div class="grid form"><label>供应商编号<input name="id" required pattern="[A-Za-z0-9_-]+" value="${esc(s.id)}" ${id?'readonly':''}></label><label>供应商名称<input name="name" required value="${esc(s.name)}"></label><label>负责人<input name="owner" value="${esc(s.owner)}"></label><label>评估日期<input name="date" type="date" required value="${s.date||new Date().toLocaleDateString('sv-SE')}"></label>${labels.map((x,i)=>`<label>${x}（0–100）<input name="s${i}" type="number" required min="0" max="100" value="${s.scores[i]}"></label>`).join('')}</div><label>评估证据与说明<textarea name="evidence" rows="3" required placeholder="填写报价对比、质量/交付数据、资质或响应记录">${esc(s.evidence)}</textarea></label><div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">保存评估</button></div></form>`)}
async function supplierSave(f,id){let v=new FormData(f),s={id:v.get('id'),name:v.get('name'),owner:v.get('owner'),date:v.get('date'),evidence:v.get('evidence'),scores:labels.map((_,i)=>Number(v.get('s'+i)))};if(!id&&state.suppliers.some(x=>x.id===s.id))return toast('编号已存在');let n=structuredClone(state),i=n.suppliers.findIndex(x=>x.id===id);if(i>=0)n.suppliers[i]=s;else n.suppliers.push(s);if(await save(n))closeModal()}
async function setWeights(f){let n=structuredClone(state);n.weights=[0,1,2].map(i=>Number(f['w'+i].value));if(n.weights.reduce((a,x)=>a+x,0)!==100)return toast('权重合计必须为100%');await save(n)}
function editPlan(id){show(`<h2>新增培养目标</h2><form onsubmit="event.preventDefault();planSave(this,'${id}')"><label>改善目标<input name="goal" required placeholder="例如：准时足量交付率达到98%"></label><label>具体行动<textarea name="action" required placeholder="例如：每周核对排产，设置交付前3天预警"></textarea></label><label>验收标准<input name="target" required placeholder="例如：连续3个月达到98%，提供交付明细"></label><label>负责人<input name="owner" required></label><label>截止日期<input name="due" type="date" required></label><div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">保存目标</button></div></form>`)}
async function planSave(f,id){let p=Object.fromEntries(new FormData(f)),n=structuredClone(state);n.plans.push({...p,id,key:crypto.randomUUID(),status:'未开始'});if(await save(n))closeModal()}async function planStatus(key,status){let n=structuredClone(state);n.plans.find(p=>p.key===key).status=status;await save(n)}
function download(name,text,type='text/csv;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([type.startsWith('text/csv')?'\ufeff':'',text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(t){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV引号未闭合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
let pendingImport=[];async function importCSV(file){if(!file)return;try{if(file.size>2000000)throw Error('文件超过2MB，请分批导入');let rows=parseCSV((await file.text()).replace(/^\ufeff/,'')),header=rows.shift()?.map(x=>x.trim()),cols=['供应商编号','月份','销售额','毛利额'].map(x=>header?.indexOf(x)??-1);if(cols.some(x=>x<0))throw Error('表头必须包含供应商编号、月份、销售额、毛利额');let seen=new Set;pendingImport=rows.map((r,i)=>{let [id,mo,sa,pr]=cols.map(j=>(r[j]||'').trim()),sales=Number(sa),profit=Number(pr),key=id+'|'+mo;if(!state.suppliers.some(s=>s.id===id))throw Error(`第${i+2}行：供应商编号不存在`);if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(mo)||!sa||!pr||!Number.isFinite(sales)||!Number.isFinite(profit)||sales<0||profit>sales)throw Error(`第${i+2}行：月份或金额不正确`);if(seen.has(key))throw Error(`第${i+2}行：编号和月份重复`);seen.add(key);return {id,month:mo,sales,profit}});if(!pendingImport.length)throw Error('没有可导入的数据');let overwrite=pendingImport.filter(m=>state.monthly.some(x=>x.id===m.id&&x.month===m.month)).length;show(`<h2>确认月度导入</h2><p>共${pendingImport.length}条，其中${overwrite}条将覆盖已有金额。</p><div class="tablewrap"><table><tr><th>编号</th><th>月份</th><th>销售额</th><th>毛利额</th></tr>${pendingImport.slice(0,30).map(m=>`<tr><td>${esc(m.id)}</td><td>${m.month}</td><td>${money(m.sales)}</td><td>${money(m.profit)}</td></tr>`).join('')}</table></div><p>预览前30条，确认后写入全部校验通过的记录。</p><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmImport()">确认导入</button></div>`)}catch(e){toast(e.message)}}
async function confirmImport(){let n=structuredClone(state);for(let m of pendingImport){let i=n.monthly.findIndex(x=>x.id===m.id&&x.month===m.month);if(i<0)n.monthly.push(m);else n.monthly[i]=m}if(await save(n))closeModal()}
async function sample(){if(state.suppliers.length)return toast('演示数据仅可在空档案时载入');let n=structuredClone(state);n.suppliers=[{id:'DEMO001',name:'演示 · 华辰供应',owner:'示例负责人',scores:[95,85,92,90,88,95,90],date:new Date().toLocaleDateString('sv-SE'),evidence:'演示数据：资质有效，质量与交付稳定。'},{id:'DEMO002',name:'演示 · 启明制造',owner:'示例负责人',scores:[85,90,75,80,70,78,85],date:new Date().toLocaleDateString('sv-SE'),evidence:'演示数据：价格有优势，需加强资源支持。'},{id:'DEMO003',name:'演示 · 远川工贸',owner:'示例负责人',scores:[80,80,50,60,70,55,70],date:new Date().toLocaleDateString('sv-SE'),evidence:'演示数据：质量及交付需要整改。'}];n.monthly=n.suppliers.map((s,i)=>({id:s.id,month,sales:[500000,300000,200000][i],profit:[130000,60000,-10000][i]}));await save(n)}
bootAuth();setInterval(async()=>{if(!accessToken||busy||$('#modal').open||document.activeElement?.matches('input,textarea,select'))return;const epoch=sessionEpoch;try{let d=await fetchState();if(epoch!==sessionEpoch)return;if(d.revision!==revision){state=d.data;revision=d.revision;render();$('#sync').textContent='已同步其他窗口更新'}}catch{}},10000);
</script></html>
